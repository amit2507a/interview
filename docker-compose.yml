version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview_postgres
    environment:
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_user -d interview_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: interview_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API (Node.js) ───────────────────────────────
  # NOTE: Build this AFTER completing services/api/src stubs
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: interview_api
    environment:
      DATABASE_URL: postgresql://interview_user:password@postgres:5432/interview_db
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/src:/app/src
    command: npm run dev

  # ─── AI Service (FastAPI) ────────────────────────────────
  # NOTE: Build this AFTER completing services/ai/app stubs
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: interview_ai
    environment:
      DATABASE_URL: postgresql://interview_user:password@postgres:5432/interview_db
      REDIS_URL: redis://redis:6379
      AI_SERVICE_PORT: 8000
      AWS_REGION: us-east-1
      BEDROCK_REGION: us-east-1
      BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
      API_URL: http://api:4000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/ai/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── AI Worker (SQS Consumer) ────────────────────────────
  # NOTE: Start this AFTER SQS + S3 are configured
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: interview_worker
    environment:
      DATABASE_URL: postgresql://interview_user:password@postgres:5432/interview_db
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: interview-videos-mvp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/worker/app:/app/app
    command: python -m app.pipeline.consumer

  # ─── Frontend (Next.js) ──────────────────────────────────
  # NOTE: Scaffold apps/web with Next.js first (Day 2)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: interview_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AI_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ai
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
